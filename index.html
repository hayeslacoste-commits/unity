<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hayes Lacoste — Game Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #5ec8f8 0%, #9be2ff 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1e293b;
      padding: 24px;
      text-align: center;
    }
    h1 {
      font-size: clamp(2.2rem, 6vw, 3.5rem);
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 4px 0 #1e293b;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    p {
      font-size: 1.1rem;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 28px;
    }
    .card {
      background: #ffffff;
      border: 3px solid #1e293b;
      border-radius: 18px;
      box-shadow: 0 8px 0 #1e293b;
      padding: 28px 24px;
      width: 100%;
      max-width: 380px;
    }
    .card input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 14px;
      font-size: 1rem;
      border: 2px solid #1e293b;
      border-radius: 10px;
      outline: none;
    }
    .card input:focus { border-color: #2563eb; }
    .error {
      color: #dc2626;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 12px;
      display: none;
    }
    .buttons {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 520px;
    }
    .btn {
      display: inline-block;
      min-width: 210px;
      padding: 20px 32px;
      font-size: 1.3rem;
      font-weight: 800;
      text-decoration: none;
      color: #ffffff;
      border-radius: 14px;
      border: 3px solid #1e293b;
      box-shadow: 0 6px 0 #1e293b;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #1e293b; }
    .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1e293b; }
    .btn-login  { background-color: #1e293b; width: 100%; }
    .btn-unity  { background-color: #2563eb; }
    .btn-html   { background-color: #16a34a; }
    .btn-plane  { background-color: #ea580c; }
    .btn-game4  { background-color: #9333ea; }
    .logout {
      margin-top: 32px;
      background: none;
      border: none;
      color: #0f172a;
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- SIGN-IN SCREEN -->
  <div id="login-screen">
    <h1>GAME PORTAL</h1>
    <p>Sign in to play Hayes Lacoste's games</p>

    <form class="card" onsubmit="handleLogin(event)">
      <input type="email" id="email" placeholder="Email" value="hayeslacoste@gmail.com" required />
      <input type="password" id="password" placeholder="Password" required />
      <div id="error-msg" class="error">Incorrect email or password.</div>
      <button type="submit" id="login-btn" class="btn btn-login">Sign In</button>
    </form>
  </div>

  <!-- GAME LAUNCHER SCREEN -->
  <div id="game-screen" class="hidden">
    <h1>GAME PORTAL</h1>
    <p>by Hayes Lacoste — Choose a game to play</p>

    <div class="buttons">
      <a class="btn btn-unity" href="/play/unity-game">Unity Version</a>
      <a class="btn btn-html" href="/play/html">HTML Version</a>
      <a class="btn btn-plane" href="/play/plane-game">Plane Game</a>
      <a class="btn btn-game4" href="/play/game-4">1v1 lol</a>
    </div>

    <button class="logout" onclick="handleLogout()">Sign Out</button>
  </div>

  <script>
    if (sessionStorage.getItem("portal_unlocked") === "true") {
      showGames();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById("login-btn");
      const errorMsg = document.getElementById("error-msg");
      btn.textContent = "Checking...";
      btn.disabled = true;

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
          })
        });

        if (res.ok) {
          sessionStorage.setItem("portal_unlocked", "true");
          errorMsg.style.display = "none";
          showGames();
        } else {
          errorMsg.style.display = "block";
        }
      } catch (err) {
        errorMsg.style.display = "block";
      } finally {
        btn.textContent = "Sign In";
        btn.disabled = false;
      }
    }

    function showGames() {
      document.getElementById("login-screen").classList.add("hidden");
      document.getElementById("game-screen").classList.remove("hidden");
    }

    async function handleLogout() {
      await fetch("/api/logout", { method: "POST" });
      sessionStorage.removeItem("portal_unlocked");
      document.getElementById("password").value = "";
      document.getElementById("game-screen").classList.add("hidden");
      document.getElementById("login-screen").classList.remove("hidden");
    }
  </script>

</body>
</html>
